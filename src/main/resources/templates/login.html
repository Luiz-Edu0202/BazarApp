<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Bazar App</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4" style="width: 400px;">
        <h3 class="text-center mb-4">Bazar App</h3>

        <!-- Alerta de Erro -->
        <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Nome do Órgão:</label>
                <input type="text" class="form-control" name="nome" required placeholder="Ex: Polícia Federal">
            </div>
            <div class="mb-3">
                <label class="form-label">Senha:</label>
                <input type="password" class="form-control" name="senha" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Entrar como:</label>
                <select class="form-select" name="tipo">
                    <option value="fiscalizador">Órgão Fiscalizador</option>
                    <option value="donatario">Órgão Donatário</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>

        <div class="text-center mt-3">
            <a th:href="@{/cadastro}">Não tem uma conta? Cadastre-se</a>
        </div>
    </div>
</div>

</body>
</html>
