<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Painel Fiscalizador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">Bazar App - Fiscalizador</a>
        <div class="d-flex align-items-center text-white">
            <span class="me-3">Olá, <b th:text="${session.usuarioLogado.nome}"></b></span>
            <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Sair</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Meus Lotes Cadastrados</h2>
        <a th:href="@{/fiscalizador/lotes/novo}" class="btn btn-success">+ Cadastrar Novo Lote</a>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Data de Entrega</th>
                    <th>Observação</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="lote : ${lotes}">
                    <td th:text="${lote.id}"></td>
                    <td th:text="${#dates.format(lote.dataEntrega, 'dd/MM/yyyy')}"></td>
                    <td th:text="${lote.observacao}"></td>
                    <td>
                        <a th:href="@{/lotes/{id}(id=${lote.id})}" class="btn btn-sm btn-info text-white">Ver Detalhes</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(lotes)}">
                    <td colspan="4" class="text-center text-muted">Nenhum lote cadastrado ainda.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
