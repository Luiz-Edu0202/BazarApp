<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Painel Donatário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="#">Bazar App - Donatário</a>
        <div class="d-flex align-items-center text-white">
            <span class="me-3">Olá, <b th:text="${session.usuarioLogado.nome}"></b></span>
            <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Sair</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-4">Lotes Doados para Nós</h2>

    <div class="card shadow">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Data de Entrega</th>
                    <th>Doado por</th>
                    <th>Observação</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="lote : ${lotes}">
                    <td th:text="${lote.id}"></td>
                    <td th:text="${#dates.format(lote.dataEntrega, 'dd/MM/yyyy')}"></td>
                    <!-- Como o Mapeador trouxe o objeto parcial, não temos o nome do fiscalizador aqui, apenas o ID.
                         Se quiser o nome, precisaremos ajustar o LoteRepository posteriormente. -->
                    <td th:text="'Órgão ID: ' + ${lote.orgaoFiscalizador.id}"></td>
                    <td th:text="${lote.observacao}"></td>
                    <td>
                        <a th:href="@{/lotes/{id}(id=${lote.id})}" class="btn btn-sm btn-info text-white">Ver Produtos</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(lotes)}">
                    <td colspan="5" class="text-center text-muted">Nenhum lote recebido ainda.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
