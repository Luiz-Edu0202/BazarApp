<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Lote</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <!-- O JavaScript abaixo volta para a tela anterior dependendo de quem logou -->
        <a href="javascript:history.back()" class="navbar-brand">&larr; Voltar</a>
    </div>
</nav>

<div class="container">
    <div class="card shadow mb-4">
        <div class="card-header bg-info text-white">
            <h4 class="mb-0">Detalhes do Lote #<span th:text="${lote.id}"></span></h4>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <p><strong>Data de Entrega:</strong> <span th:text="${#dates.format(lote.dataEntrega, 'dd/MM/yyyy')}"></span></p>
                    <p><strong>Órgão Fiscalizador:</strong> <span th:text="${lote.orgaoFiscalizador.nome}"></span></p>
                </div>
                <div class="col-md-6">
                    <p><strong>Órgão Donatário:</strong> <span th:text="${lote.orgaoDonatario.nome}"></span></p>
                    <p><strong>Observação:</strong> <span th:text="${lote.observacao}"></span></p>
                </div>
            </div>
        </div>
    </div>

    <h4 class="mb-3">Produtos Deste Lote</h4>
    <div class="card shadow">
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                <tr>
                    <th>Código</th>
                    <th>Nome do Produto</th>
                    <th>Descrição</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="produto : ${lote.produtos}">
                    <td th:text="${produto.codigo}"></td>
                    <td th:text="${produto.nome}"></td>
                    <td th:text="${produto.descricao}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(lote.produtos)}">
                    <td colspan="3" class="text-center text-muted">Este lote não possui produtos cadastrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
