<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Bazar App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100 mt-5 mb-5">
    <div class="card shadow p-4" style="width: 500px;">
        <h3 class="text-center mb-4">Cadastro de Órgão</h3>

        <form th:action="@{/cadastro}" method="post">
            <div class="mb-3">
                <label class="form-label">Tipo de Órgão:</label>
                <select class="form-select" name="tipo" id="tipoOrgao" onchange="toggleCampos()">
                    <option value="fiscalizador">Órgão Fiscalizador</option>
                    <option value="donatario">Órgão Donatário</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Nome:</label>
                <input type="text" class="form-control" name="nome" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha:</label>
                <input type="password" class="form-control" name="senha" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Descrição:</label>
                <textarea class="form-control" name="descricao" rows="2"></textarea>
            </div>

            <!-- Campos exclusivos do Donatário -->
            <div id="camposDonatario" style="display: none;">
                <div class="mb-3">
                    <label class="form-label">Endereço:</label>
                    <input type="text" class="form-control" name="endereco">
                </div>
                <div class="mb-3">
                    <label class="form-label">Telefone:</label>
                    <input type="text" class="form-control" name="telefone">
                </div>
                <div class="mb-3">
                    <label class="form-label">Horário de Funcionamento:</label>
                    <input type="text" class="form-control" name="horarioFuncionamento" placeholder="Ex: 08:00 às 17:00">
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100">Cadastrar</button>
        </form>

        <div class="text-center mt-3">
            <a th:href="@{/login}">Voltar para o Login</a>
        </div>
    </div>
</div>

<script>
    function toggleCampos() {
        var tipo = document.getElementById("tipoOrgao").value;
        var campos = document.getElementById("camposDonatario");
        if (tipo === "donatario") {
            campos.style.display = "block";
        } else {
            campos.style.display = "none";
        }
    }
</script>

</body>
</html>
